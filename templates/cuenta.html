{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<h1>Cambiar contraseña</h1>
<form method="post" class="panel estrecho">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="actual">Contraseña actual</label>
  <input id="actual" name="actual" type="password" autocomplete="current-password" required>
  <label for="nueva">Nueva contraseña (mínimo 8 caracteres)</label>
  <input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="8" required>
  <label for="repetir">Repetir nueva contraseña</label>
  <input id="repetir" name="repetir" type="password" autocomplete="new-password" required>
  <button class="btn grande">Guardar contraseña</button>
</form>
{% endblock %}
