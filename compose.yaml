services:
  sivent:
    build: .
    container_name: sivent-web
    env_file:
      - path: .env
        required: false   # si falta, la app genera una clave; mejor usar iniciar.bat, que la crea
    environment:
      SIVENT_DB: /data/sivent.db
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped
